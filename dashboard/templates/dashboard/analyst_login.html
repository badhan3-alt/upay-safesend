<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Analyst sign in - SafeSend</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7f8; color: #17314d; font: 16px system-ui, sans-serif; }
        main { width: min(420px, calc(100% - 32px)); padding: 28px; box-sizing: border-box; border: 1px solid #e3e9ed; border-radius: 16px; background: white; box-shadow: 0 12px 32px #17314d12; }
        h1 { margin: 0 0 8px; font-size: 24px; }
        p { color: #687987; }
        label { display: block; margin: 16px 0 6px; font-weight: 600; }
        input { width: 100%; box-sizing: border-box; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
        button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 8px; background: #e97818; color: white; font: inherit; font-weight: 700; cursor: pointer; }
        .errors { color: #b91c1c; }
        a { color: #17314d; }
    </style>
</head>
<body>
    <main>
        <h1>Analyst sign in</h1>
        <p>Use your SafeSend analyst account to access transaction monitoring.</p>
        {% if form.errors %}
            <p class="errors">Sign-in failed. Check your username and password, then try again.</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <label for="{{ form.username.id_for_label }}">Username</label>
            {{ form.username }}
            <label for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}
            <button type="submit">Sign in</button>
        </form>
        <p><a href="/">Return to the demo wallet</a></p>
    </main>
</body>
</html>
